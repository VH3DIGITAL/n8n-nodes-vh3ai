# Publishes this n8n community node package to npm on every version tag push.
#
# From May 1 2026, n8n requires all community nodes submitted for verification
# to be published via GitHub Actions with an npm provenance statement. This
# workflow satisfies that requirement.
#
# ─── ONE-TIME npm AUTH SETUP ───────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open the package settings for n8n-nodes-vh3ai.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: VH3DIGITAL
#        Repository name:  n8n-nodes-vh3ai
#        Workflow name:    publish.yml
#        Environment:      (leave blank)
#   4. Leave the NPM_TOKEN secret unset. GitHub's OIDC token is used instead.
#
# Option B — npm Granular Access Token (fallback):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token.
#      Scope it to n8n-nodes-vh3ai with "Read and write" publish permission.
#   2. In GitHub: Settings → Secrets and variables → Actions → New repository
#      secret. Name it NPM_TOKEN and paste the token value.
#
# Both options sign the package with provenance via GitHub's OIDC infrastructure.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships with npm >= 11.5.1, which is required for OIDC Trusted
      # Publisher support. Node 22 LTS still ships with npm 10.9 and the
      # in-place self-upgrade (npm install -g npm@latest) is unreliable on
      # the GitHub-hosted runner, so we pin Node 24 here.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test
        continue-on-error: true

      - name: Publish to npm with provenance
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
